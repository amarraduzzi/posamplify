# Builds the Android app (Amplify Caisse: the till + printing to any ticket printer) and puts the APK on
# the till's own site, so it can be downloaded at https://caisse.amplifygrowthstudio.com/amplify-caisse.apk
name: Android app

on:
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the APK
        working-directory: apps/android
        run: gradle --no-daemon assembleRelease
      - name: Keep the APK as a build result
        uses: actions/upload-artifact@v4
        with: { name: amplify-caisse, path: apps/android/app/build/outputs/apk/release/app-release.apk }
      - name: Publish it on the till's site
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk apps/pos/public/amplify-caisse.apk
          git config user.name "Amplify build"
          git config user.email "build@amplifygrowthstudio.com"
          git add apps/pos/public/amplify-caisse.apk
          git commit -m "Android app: new APK (build ${{ github.run_number }})" || exit 0
          git pull --rebase
          git push
