# Supabase CLI configuration (https://supabase.com/docs/guides/local-development)
project_id = "resto-platform"

[api]
# Only "public" is exposed to the browser. Internal helpers live in schema
# "app" and must never be added here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
